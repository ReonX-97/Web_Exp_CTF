services:
  # Web Service
  - type: web
    name: ctf-challenge
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ctf-database
          property: connectionString

databases:
  - name: ctf-database
    databaseName: ctf_challenge
    user: ctf_user